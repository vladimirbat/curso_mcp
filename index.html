<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Descuentos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>Calculadora de Descuentos</h1>
    <div class="form-group">
        <label for="price">Precio (€):</label>
        <input id="price" type="number" min="0" step="0.01" placeholder="Ingrese el precio" required>
    </div>
    <div class="form-group">
        <label for="discount">Descuento (%):</label>
        <input id="discount" type="number" min="0" max="100" placeholder="Ingrese el porcentaje" required>
    </div>

    <button id="calculate">Calcular</button>

    <p id="result"></p>

    <script src="app.js"></script>
</body>
</html>
